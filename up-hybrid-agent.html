<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>live-panel</title>
<style>
/* live-panel template. Content, colours, sizes: all come from the JSON config (see references/config-schema.md).
   Layout never moves. Everything that changes is a pure function of time: window.seek(t). */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--c-bg,#111);}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;white-space:pre;color:var(--c-fg);font-family:var(--font);font-size:var(--fs);line-height:var(--lh)}
#stage>*{position:absolute}
b,.b{font-weight:700}
.tb{left:0;top:0;text-align:center;background:var(--c-bar);color:var(--c-dim)}
.tb i{position:absolute;border-radius:50%}
.sw{display:inline-block;width:.62em;height:.62em;margin-right:.55em;vertical-align:baseline}
.box{border-top:2px solid;border-bottom:2px solid}
.box::before,.box::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:repeating-linear-gradient(180deg,currentColor 0 calc(var(--lh) - 7px),transparent calc(var(--lh) - 7px) var(--lh))}
.box.solid{border:var(--bw,2px) solid currentColor;border-radius:var(--radius,0px)}
.box.solid::before,.box.solid::after{display:none}
.box.dashed{border-style:dashed}
.box::before{left:0}.box::after{right:0}
.box .ln{color:var(--c-fg);height:var(--lh);padding-right:0}
.ln.flex{display:flex;align-items:center}
.ln.flex>div{overflow:visible}
.wire{background:var(--c-line)}
.dashv{background:repeating-linear-gradient(180deg,var(--c-line) 0 5px,transparent 5px 9px)}
.dashh{background:repeating-linear-gradient(90deg,var(--c-line) 0 5px,transparent 5px 9px)}
.pk{border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;display:none}
.pk.s{width:6px;height:6px;margin:-3px 0 0 -3px}
.bar{position:relative;display:block;height:20px;background-image:radial-gradient(var(--c-dots,#566078) 1px,transparent 1.3px);background-size:4px 4px}
.bar u{position:absolute;left:0;top:0;bottom:0;text-decoration:none}
.bar u.end::after{content:"";position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-conic-gradient(var(--c-bg) 0 25%,transparent 0 50%) 0 0/4px 4px;opacity:.55}
.bar s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--c-fg);text-decoration:none}
.cur{display:inline-block;width:.62em;height:1.05em;vertical-align:-.18em;margin-left:.4em}
.tarrow{height:0;border-top:2px dashed var(--c-line)}
.glyph{text-align:center;line-height:1}
.logframe{border:2px solid var(--c-line2,#3a4154);border-top:0}
.logtop{height:0;border-top:2px solid var(--c-line2,#3a4154)}
.lgrow{position:absolute}
.lgrow span{position:absolute;top:0}
#err{position:absolute;left:10px;top:10px;color:#f66;font:14px monospace;white-space:pre-wrap;z-index:9}

      var mn2 = svg(ctx,'feMergeNode',{'in':'SourceGraphic'});
      fmr.appendChild(mn1); fmr.appendChild(mn2);
      fltr.appendChild(fga); fltr.appendChild(fmr);
      defs.appendChild(fltr);
      svgEl.appendChild(defs);

      // Trapezoid group (per stage): two widths = barW(v_above) top, barW(v) bottom
      // Except first: top = barW(v0), bottom = barW(v1) at transition;
      // we draw each stage as a trapezoid with top width and bottom width based on own value and next value.
      // Simpler: each stage i drawn as a trapezoid with
      //   topW = barW(stages[i].value), bottomW = barW(i<n-1? stages[i+1].value : stages[i].value*0.98)
      // Then small separator gap.
      stages.forEach(function(s,i){
        var yTop = stageCy[i] - stageH/2;
        var yBot = stageCy[i] + stageH/2;
        var tw = barW(s.value);
        var bw = (i<n-1)? barW(stages[i+1].value) : Math.round(tw*0.92);
        var pts = [
          [cx - tw/2, yTop],
          [cx + tw/2, yTop],
          [cx + bw/2, yBot],
          [cx - bw/2, yBot]

        var acc = stAcc(i);
        var accf = stAccf(i);
        var poly = svg(ctx,'polygon',{
          points: pts.map(function(p){return p[0]+','+p[1]}).join(' '),
          fill: ctx.cc(accf),
          stroke: ctx.cc(acc),
          'stroke-width': dark?'1.2':'1.5',
          'stroke-linejoin':'round'
        });
        ctx.mark(poly, 'box');
        svgEl.appendChild(poly);
      });

      // Using a subtle dotted guide for each inter-stage gap on left/right edges

        var ln = svg(ctx,'line',{
          x1:cx, y1:stageCy[i] + stageH/2, x2:cx, y2:stageCy[i+1] - stageH/2,
          stroke: ctx.cc('grid'), 'stroke-width':'1', 'stroke-dasharray':'2 3'
        });
        ctx.mark(ln,'edge');
        svgEl.appendChild(ln);
      }

      // Labels (HTML for reliable CJK rendering)
      var ls = Number(e.labelScale)||1;
      var labelSize = Math.max(12, Math.min(u*1.55*ls, 17*ls));
      var labelLh = Math.round(labelSize*1.55);
      var subSize = Math.max(11, Math.round(labelSize*0.82));
      var subLh = Math.round(subSize*1.55);

      var vs = Number(e.valueScale)||1;
      var valSize = Math.max(14, Math.min(u*2.0*vs, 22*vs));
      var valLh = Math.round(valSize*1.3);

      stages.forEach(function(s,i){
        var yTop = stageCy[i] - stageH/2;
        // label (left-aligned, to the left of bar area)
        var labelX = marginX;
        var labelBox = el('div', null,
          'position:absolute;left:'+labelX+'px;top:'+Math.round(yTop + (stageH - labelLh - subLh)/2)+'px;width:'+labelW+'px;white-space:pre;');
        var l1 = el('div', null, 'height:'+labelLh+'px;line-height:'+labelLh+'px;font-size:'+labelSize+'px;color:'+ctx.cc('fg')+';font-weight:600;overflow:hidden;text-overflow:ellipsis;');
        var fit1 = ctx.fit(s.label, labelSize, labelW-4, null, 11, true);
        l1.style.fontSize = fit1.size+'px';
        l1.textContent = fit1.text;
        ctx.mark(l1,'text');
        labelBox.appendChild(l1);
        var l2 = el('div', null, 'height:'+subLh+'px;line-height:'+subLh+'px;font-size:'+subSize+'px;color:'+ctx.cc('muted')+';letter-spacing:0.3px;overflow:hidden;text-overflow:ellipsis;');

        l2.style.fontSize = fit2.size+'px';
        l2.textContent = fit2.text;
        ctx.mark(l2,'text');

        var pct = r==null ? null : (r >= 1 || r === 0 ? Math.round(r) : Number(r.toPrecision(2)));

        cBox.textContent = (pct==null ? '—' : fmtPct(pct)+'%');
        ctx.mark(cBox,'text');
        root.appendChild(cBox);
      }

      // ---- particles: fast tempo, flowing down the funnel centre ----
      // One packet per inter-stage segment, density proportional to stage value.
      var PKG = [];

        var yA = stageCy[i] - stageH/2 + 4, yB = stageCy[i] + stageH/2 - 4;

                    period: state.period/Math.max(1, Math.round(state.period/(2.4 + 0.6*ctx.hash(31+i, k)))), off: 3*ctx.hash(53+i, k)});

      // Keep it subtle: a slightly brighter stroke / glow. We'll add a highlight rect per stage
      // that we animate opacity on in seek().

        var yTop = stageCy[i] - stageH/2;

          [cx + tw/2 + pad, yTop - pad],
          [cx + bw/2 + pad, stageCy[i] + stageH/2 + pad],
          [cx - bw/2 - pad, stageCy[i] + stageH/2 + pad]

          points: pts.map(function(p){return p[0]+','+p[1]}).join(' '),

          'stroke-linejoin':'round',
          opacity:'0',
          'pointer-events':'none'

        svgEl.appendChild(poly);
        return poly;
      });

      // Save refs for seek
      state.pk = PKG;
      state.hiRects = hiRects;
      state.cx = cx;
      state.dark = dark;
      return state;
    },

    seek: function(t, ctx, st){
      var s = st || (ctx && ctx.state);

      var n = s.n;

        var half = (p.tw + (p.bw-p.tw)*frac)/2 - 10;
        var x = s.cx + p.fx*half;

        var yt = Math.max(p.yA, y - (s.dark?8:10)), ft = (yt-p.yA)/Math.max(1,(p.yB-p.yA));
        p.tail.setAttribute('cy', yt); p.tail.setAttribute('cx', s.cx + p.fx*((p.tw + (p.bw-p.tw)*ft)/2 - 10));

      // ---- stage highlight (slow): each stage highlighted for period/n seconds,
      // with ~0.5 s fade, single focus at a time; first stage already lit at t=0.
      var perStage = period/n;
      var focusI = Math.floor(((t/period) - 0) * n) % n;
      if(focusI<0) focusI += n;
      var phaseInStage = (t/perStage) - Math.floor(t/perStage);
      s.hiRects.forEach(function(r,i){
        var op = 0;
        if(i===focusI){
          op = phaseInStage>0.9 ? (1-phaseInStage)/0.1 : 1;   // lit from frame 0, fades out before the next
          op *= s.dark? 0.22 : 0.55;
        }
        r.setAttribute('opacity', op.toFixed(3));
      });
    },

    check: function(ctx){
      var pr = [];
      var e = ctx.e;
      var st = e.stages||[];
      for(var i=1;i<st.length;i++){
        if(typeof st[i].value==='number' && typeof st[i-1].value==='number' && st[i].value>st[i-1].value){
          pr.push('stages['+i+'].value ('+st[i].value+') > stages['+(i-1)+'].value ('+st[i-1].value+'): funnel values must be non-increasing');
        }
      }
      return pr;
    }
  });
})();

            A.parts[1].setAttribute('transform', 'translate(0 ' + fx(on && w < 0.2 ? 1.5*px*bump(w/0.2) : 0) + ')');
          } else if(k === 'refresh-cw'){
            tf = 'rotate(' + fx(on ? 360*easeInOutCubic(w) : 0) + ' 12 12)';
          }
          if(breath !== 1) tf = 'translate(12 12) scale(' + breath.toFixed(3) + ') translate(-12 -12) ' + tf;
          A.g.setAttribute('transform', tf);
        });
        // status card in pure ambient: a lit dot chases along the row, one step per AP/N
        if(s.ambientOnly && s.status){
          var N = s.status.dots.length, hi = Math.floor(q0*N) % N;
          s.status.dots.forEach(function(d, k){
            d.setAttribute('fill', k === hi ? s.status.accOn : s.status.off);
            d.setAttribute('opacity', k === hi ? 1 : (k === (hi - 1 + N) % N ? 0.6 : 0.9));
          });
        }
      }

      var s = st || (ctx && ctx.state);
      if(!s) return;
      if(s.amb) ambientSeek(t, s);
      if(!s.H) return;
      var P = s.period, T = s.T, H = s.H;
      var ease = LP.ease.inOut;
      function smooth(x){ x = x < 0 ? 0 : (x > 1 ? 1 : x); return x*x*(3 - 2*x); }

      // crossfade window of the focus, centred on FOCUS_AT, at least ~0.3 s wide
      var fw = clamp(0.3/T*1.05, 0.24, 0.8), f0 = clamp(FOCUS_AT - fw/2, 0, 1 - fw);

      // position of the token at time tt: dwell inside the node (hidden behind the card), then along the edge
      function phase(tt){ var q = modf(tt, P)/T, i = Math.floor(q); return {i:i % H, p:q - i}; }
      function posAt(tt){
        var ph = phase(tt), p = ph.p, hop = s.hops[ph.i], prev = s.hops[(ph.i - 1 + H) % H];
        if(!hop.E) return null;
        var E = hop.E;
        if(p < 0.4){
          var from = along(prev.E || E, prev.E ? 1 : 0), to = along(E, 0), q = ease(p/0.4);
          return {x:from.x + (to.x-from.x)*q, y:from.y + (to.y-from.y)*q, vis:false};
        }
        var a = along(E, ease((p - 0.4)/0.6));
        return {x:a.x, y:a.y, vis:true};
      }
      // the entry token rides trigger → first node during the closing hop of a round
      function entryAt(tt){
        var ph = phase(tt);
        if(!s.hops[ph.i].entry || ph.p < 0.4) return null;
        var p = ph.p, a = along(s.entryE, ease((p - 0.4)/0.6));
        return {x:a.x, y:a.y, vis:true};
      }
      function edgeEnv(p){ return p < 0.40 ? 0 : (p < 0.46 ? smooth((p - 0.40)/0.06) : (p < 0.88 ? 1 : 1 - smooth((p - 0.88)/0.12))); }

      // exactly one focus: the source until the token is mid-edge, then the target, crossfaded
      var now = phase(t), p = now.p, hop = s.hops[now.i];
      var m = smooth((p - f0)/fw);
      var nodeI = {}, edgeI = [];
      s.edges.forEach(function(E, k){ edgeI[k] = 0; });
      nodeI[hop.from] = 1 - m;
      nodeI[hop.to] = (nodeI[hop.to] || 0) + m;
      if(hop.E) edgeI[s.edges.indexOf(hop.E)] = edgeEnv(p);
      if(hop.entry && s.entryE){
        edgeI[s.edges.indexOf(s.entryE)] = Math.max(edgeI[s.edges.indexOf(s.entryE)], edgeEnv(p));
        // the entry card glows weakly while the next input is on its way
        var env = p < 0.9 ? smooth((p - 0.05)/0.2) : 1 - smooth((p - 0.9)/0.1);
        nodeI[s.entryId] = Math.max(nodeI[s.entryId] || 0, 0.5*env);
      }
      Object.keys(s.nodeLit).forEach(function(id){ s.nodeLit[id].style.opacity = (nodeI[id] || 0).toFixed(3); });
      function put(c, pos){ c.setAttribute('cx', pos.x.toFixed(1)); c.setAttribute('cy', pos.y.toFixed(1)); }
      var dashOff = s.amb ? -modf(t/s.AP*3, 1)*s.dashLen : -((t/s.dashPeriod) % 1) * s.dashLen;
      s.edges.forEach(function(E, k){
        E.lit.setAttribute('opacity', edgeI[k].toFixed(3));
        if(E.dashed) E.lit.setAttribute('stroke-dashoffset', dashOff.toFixed(2));
        // ambient flow: dots drift along forward edges
        E.dots.forEach(function(D){ put(D.el, along(E, ((t/s.flowPeriod) + D.off) % 1)); });
      });

      // tokens + trails
      function place(tk, fn, step){
        var pos = fn(t), on = pos && pos.vis;
        tk.head.setAttribute('opacity', on ? 1 : 0);
        if(tk.halo) tk.halo.setAttribute('opacity', on ? 0.28 : 0);
        if(on){ put(tk.head, pos); if(tk.halo) put(tk.halo, pos); }
        tk.trail.forEach(function(c, k){
          var pp = on && fn(t - step*(k+1));
          if(pp && pp.vis){ put(c, pp); c.style.display = ''; } else c.style.display = 'none';
        });
      }
      place(s.tok, posAt, 0.09*T);
      if(s.tokIn) place(s.tokIn, entryAt, 0.09*T);

      // status card: round (1..R), current step and visited-node dots; the step flips with the focus
      if(s.status && !s.ambientOnly){
        var onTarget = m >= 0.5;
        var nodeId = onTarget ? hop.to : hop.from;
        var kk2 = hop.k + (onTarget ? 1 : 0);
        s.status.round.textContent = s.status.rTpl.replace('{n}', hop.round + 1);
        s.status.step.textContent = s.status.sTpl.replace('{label}', s.byId[nodeId].label);
        var visits = s.roundLen[hop.round];
        s.status.dots.forEach(function(d, k){
          d.setAttribute('fill', k <= kk2 ? s.status.accOn : s.status.off);
          d.setAttribute('opacity', k >= visits ? 0 : (k === kk2 ? 1 : (k < kk2 ? 0.45 : 0.9)));
        });
      }
    },

    events: function(lo, hi, ctx){
      var s = ctx && ctx.state;
      if(!s || !s.H || s.ambientOnly) return [];
      var out = [];
      var k0 = Math.floor(lo/s.T), k1 = Math.ceil(hi/s.T);
      var logc = (ctx.e.log && ctx.e.log.c) || 'acc1';
      var who = (ctx.e.log && ctx.e.log.who) || 'loop';
      for(var k = k0; k <= k1; k++){
        var hop = s.hops[((k % s.H) + s.H) % s.H];
        var from = s.byId[hop.from], to = s.byId[hop.to];
        out.push({t:k*s.T, who:who, c:logc, m:from.label + ' → ' + to.label, g:hop.E && hop.E.back ? 'loop' : ''});
      }
      return out;
    },

    check: function(ctx){
      var pr = [];
      var s = ctx.state;
      if(s && s.problems) pr = pr.concat(s.problems);
      var e = ctx.e;
      var mo = e.motion || 'ambient', apc = Number(e.ambientPeriod) || 3.0;
      if(mo.indexOf('walk') >= 0 && mo.indexOf('ambient') >= 0){
        var per = Number(e.period) || 26, qq = per/apc;
        if(Math.abs(qq - Math.round(qq)) > 1e-6) pr.push('period '+per+' is not a whole multiple of ambientPeriod '+apc);
      }
      // grid cells, spans included
      var seen = {};
      (e.nodes||[]).forEach(function(n){
        for(var c = 0; c < (n.span||1); c++){
          var k = (n.row||0) + ',' + ((n.col||0) + c);
          if(seen[k]) pr.push('nodes "'+seen[k]+'" and "'+n.id+'" share grid cell '+k);
          seen[k] = n.id;
        }
      });
      return pr;
    }
  });
})();

</script>
<script>/* view: ring.js */
/* ring view — loop / cycle diagram */
(function(){
  LP.registerView('ring', {
    build: function(ctx){
      var e = ctx.e, root = ctx.root, rect = ctx.rect;
      var w = rect.w, h = rect.h;
      var dark = ctx.dark;
      var period = e.period || 28;
      var steps = e.steps || [];
      var n = steps.length;
      if(n < 3) n = 3;
      var u = Math.min(w, h) / 100;
      var cx = w / 2, cy = h / 2;

      // ---- title area ----
      var titleH = 0, subH = 0;
      if(e.title){
        var titleSize = Math.round(u * 3.2);
        titleSize = Math.min(titleSize, 42);
        titleSize = Math.max(titleSize, 22);
        var tf = ctx.fit(e.title, titleSize, w * 0.8, 'var(--font-title)', 18, true);
        var titleEl = ctx.el('div');
        titleEl.style.cssText = 'position:absolute;left:0;top:' + Math.round(u*2) + 'px;width:' + w + 'px;text-align:center;font-family:var(--font-title);font-size:' + tf.size + 'px;line-height:' + Math.round(tf.size*1.3) + 'px;color:' + ctx.cc('fg') + ';font-weight:700;white-space:pre';
        titleEl.textContent = tf.text;
        ctx.mark(titleEl, 'text');
        root.appendChild(titleEl);
        titleH = Math.round(tf.size * 1.3) + u*2;
      }
      if(e.subtitle){
        var subSize = Math.round(u * 1.8);
        subSize = Math.min(subSize, 22);
        subSize = Math.max(subSize, 13);
        var sf = ctx.fit(e.subtitle, subSize, w * 0.7, null, 11);
        var subEl = ctx.el('div');
        subEl.style.cssText = 'position:absolute;left:0;top:' + Math.round(titleH + u*0.5) + 'px;width:' + w + 'px;text-align:center;font-size:' + sf.size + 'px;line-height:' + Math.round(sf.size*1.4) + 'px;color:' + ctx.cc('muted') + ';white-space:pre';
        subEl.textContent = sf.text;
        ctx.mark(subEl, 'text');
        root.appendChild(subEl);
        subH = Math.round(sf.size * 1.4);
      }
      var topPad = titleH + subH + u*2;

      // ---- layout ----
      var availH = h - topPad - u*2;
      var availW = w - u*4;
      var maxLab = 0;
      for(var q=0;q<steps.length;q++){
        var lw = ctx.measure(steps[q].label||'', Math.round(u*2.3), ctx.TH.titleFont, true);
        if(steps[q].desc) lw = Math.max(lw, ctx.measure(steps[q].desc, Math.round(u*1.6), null));
        maxLab = Math.max(maxLab, Math.min(lw, u*17));
      }
      var sideRoom = maxLab + u*2.8*1.25 + u*4.5;   // node radius + gap + label + margin
      var vRoom = u*2.8*1.25 + u*3 + Math.round(u*2.3)*1.25 + Math.round(u*1.6)*1.3 + u*1.5;
      var ringR = Math.min(availW/2 - sideRoom, availH/2 - vRoom);
      ringR = Math.max(ringR, u*18);
      cy = topPad + availH/2;

      // SVG
      var svg = ctx.svg('svg', {width: w, height: h});
      svg.style.cssText = 'position:absolute;left:0;top:0;overflow:visible;pointer-events:none';
      root.appendChild(svg);

      // outer ring track (static, faint)
      var track = ctx.svg('circle', {
        cx: cx, cy: cy, r: ringR,
        fill: 'none',
        stroke: ctx.cc('grid'),
        'stroke-width': dark ? 1.2 : 1.5
      });
      svg.appendChild(track);

      // step segments (arcs between steps)
      var stepAngle = 2 * Math.PI / n;
      // angles: step i is at angle = -PI/2 + i*stepAngle (start at top, go clockwise)
      function angleAt(i){ return -Math.PI/2 + i * stepAngle; }
      function ptOnRing(ang, r){
        return [cx + Math.cos(ang)*r, cy + Math.sin(ang)*r];
      }

      // arc path between step i and step i+1
      function arcPath(i){
        var a0 = angleAt(i) + stepAngle * 0.12;
        var a1 = angleAt((i+1)%n) - stepAngle * 0.12;
        var p0 = ptOnRing(a0, ringR);
        var p1 = ptOnRing(a1, ringR);
        var largeArc = (a1 - a0) > Math.PI ? 1 : 0;
        return 'M' + p0[0] + ',' + p0[1] + ' A' + ringR + ',' + ringR + ' 0 ' + largeArc + ' 1 ' + p1[0] + ',' + p1[1];
      }

      // arrow heads on arcs
      function arrowHead(i){
        var a = angleAt((i+1)%n) - stepAngle * 0.12;
        var tp = ptOnRing(a, ringR);
        var ap = ptOnRing(a - 0.15, ringR);
        var dx = tp[0]-ap[0], dy = tp[1]-ap[1];
        var L = Math.hypot(dx,dy)||1; dx/=L; dy/=L;
        var sz = u*1.2;
        var bx = tp[0]-dx*sz, by = tp[1]-dy*sz;
        return tp[0]+','+tp[1]+' '+(bx-dy*sz*0.5)+','+(by+dx*sz*0.5)+' '+(bx+dy*sz*0.5)+','+(by-dx*sz*0.5);
      }

      var arcPaths = [];
      var arrowHeads = [];
      for(var i=0;i<n;i++){
        var ap_ = ctx.svg('path', {
          d: arcPath(i),
          fill: 'none',
          stroke: ctx.cc('line2'),
          'stroke-width': dark ? 1.5 : 2,
          'stroke-linecap': 'round'
        });
        svg.appendChild(ap_);
        arcPaths.push(ap_);
        var ah = ctx.svg('polygon', {
          points: arrowHead(i),
          fill: ctx.cc('line2')
        });
        svg.appendChild(ah);
        arrowHeads.push(ah);
      }

      // step nodes + labels
      var nodeR = u * 2.8;
      var stepNodes = [];
      var stepLabels = [];
      var stepDescs = [];
      for(var i=0;i<n;i++){
        var a = angleAt(i);
        var p = ptOnRing(a, ringR);
        // node circle
        var nd = ctx.svg('circle', {
          cx: p[0], cy: p[1], r: nodeR,
          fill: ctx.cc('panel'),
          stroke: ctx.cc('line'),
          'stroke-width': 1.5
        });
        svg.appendChild(nd);
        // step number inside node
        var nt = ctx.svg('text', {
          x: p[0], y: p[1],
          'text-anchor': 'middle',
          'dominant-baseline': 'central',
          fill: ctx.cc('muted'),
          'font-size': Math.round(u*1.9),
          'font-family': 'var(--font)'
        });
        nt.textContent = String(i+1);
        svg.appendChild(nt);

        // label outside
        var labelR = ringR + nodeR + u*3;
        var lp = ptOnRing(a, labelR);
        var anchor = 'middle';
        var dx = 0;
        if(Math.cos(a) > 0.2){ anchor = 'start'; dx = u*1; }
        else if(Math.cos(a) < -0.2){ anchor = 'end'; dx = -u*1; }
        var lab = steps[i] ? steps[i].label : ('step '+(i+1));
        var labMaxW = u * 17;
        var labSize = Math.round(u*2.3);
        var lf = ctx.fit(lab, labSize, labMaxW, 'var(--font-title)', 11, true);
        var hasDesc = !!(steps[i] && steps[i].desc);
        var dSz = Math.round(u*1.6);
        var gapY = lf.size*0.62 + dSz*0.62 + u*0.45;
        var isTop = Math.sin(a) < -0.5;
        var labY = (hasDesc && isTop) ? lp[1] - gapY : lp[1];
        var descY = (hasDesc && isTop) ? lp[1] : lp[1] + gapY;
        var lt = ctx.svg('text', {
          x: lp[0]+dx, y: labY,
          'text-anchor': anchor,
          'dominant-baseline': 'central',
          fill: ctx.cc('fg'),
          'font-size': lf.size,
          'font-family': 'var(--font-title)',
          'font-weight': '700'
        });
        lt.textContent = lf.text;
        svg.appendChild(lt);
        ctx.mark(lt, 'text');

        // description below label
        if(steps[i] && steps[i].desc){
          var descMaxW = u * 17;
          var descSize = Math.round(u*1.6);
          var df = ctx.fit(steps[i].desc, descSize, descMaxW, null, 11);
          var dt = ctx.svg('text', {
            x: lp[0]+dx, y: descY,
            'text-anchor': anchor,
            'dominant-baseline': 'central',
            fill: ctx.cc('muted'),
            'font-size': df.size,
            'font-family': 'var(--font)'
          });
          dt.textContent = df.text;
          svg.appendChild(dt);
          ctx.mark(dt, 'text');
          stepDescs.push({el: dt, y: descY});
        }

        stepNodes.push({circle: nd, num: nt, x: p[0], y: p[1], a: a});
        stepLabels.push({el: lt, x: lp[0]+dx, y: lp[1]});
      }

      // comet (glowing dot + tail)
      var cometR = u * 1.9;
      var comet = ctx.svg('circle', {
        cx: 0, cy: 0, r: cometR,
        fill: ctx.cc('acc1'),
        stroke: 'none'
      });
      svg.appendChild(comet);

      // comet glow
      var glow = ctx.svg('circle', {
        cx: 0, cy: 0, r: cometR * 3,
        fill: ctx.cc('acc1'),
        opacity: dark ? 0.25 : 0.18
      });
      svg.appendChild(glow);

      // inner sub-loop (optional spokes / inner cycle)
      var innerR = ringR * 0.45;
      var innerCircle = null;
      var innerLabel = null;
      var innerIter = null;
      if(e.innerLoop){
        innerCircle = ctx.svg('circle', {
          cx: cx, cy: cy, r: innerR,
          fill: dark ? ctx.cc('panel') : ctx.cc('accf1'),
          stroke: ctx.cc('line2'),
          'stroke-width': dark ? 1 : 1.2,
          opacity: 0.7
        });
        svg.appendChild(innerCircle);
        ctx.mark(innerCircle, 'frame');
      }
      var innerItems = [];
      var innerList = Array.isArray(e.innerLoop) ? e.innerLoop : [];
      for(var k=0;k<innerList.length;k++){
        var ia = -Math.PI/2 + k * 2*Math.PI/innerList.length;
        var ip = ptOnRing(ia, innerR*1.22);
        var itf = ctx.fit(innerList[k], Math.round(u*1.5), u*10, null, 11);
        var it = ctx.svg('text', {x: ip[0], y: ip[1], 'text-anchor':'middle', 'dominant-baseline':'central',
          fill: ctx.cc('muted'), 'font-size': itf.size, 'font-family':'var(--font)'});
        it.textContent = itf.text; svg.appendChild(it); ctx.mark(it, 'text'); innerItems.push(it);
      }

      // center text: loop name + iteration
      var loopName = e.name || e.title || 'Loop';
      var nf = ctx.fit(loopName, Math.round(u*2.2), innerR*1.6, 'var(--font-title)', 11, true);
      var centerName = ctx.svg('text', {
        x: cx, y: cy - u*1.5,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('fg'),
        'font-size': nf.size,
        'font-family': 'var(--font-title)',
        'font-weight': '700'
      });
      centerName.textContent = nf.text;
      svg.appendChild(centerName);
      ctx.mark(centerName, 'text');

      var iterLabel = ctx.svg('text', {
        x: cx, y: cy + u*1.5,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('fg'),
        'font-size': Math.round(u*2.8),
        'font-family': 'var(--font-title)',
        'font-weight': '700',
        'font-variant-numeric': 'tabular-nums'
      });
      iterLabel.textContent = '#1';
      svg.appendChild(iterLabel);
      ctx.mark(iterLabel, 'text');

      var iterSub = ctx.svg('text', {
        x: cx, y: cy + u*4.2,
        'text-anchor': 'middle',
        'dominant-baseline': 'central',
        fill: ctx.cc('muted'),
        'font-size': Math.round(u*1.5),
        'font-family': 'var(--font)'
      });
      iterSub.textContent = 'iteration';
      svg.appendChild(iterSub);
      ctx.mark(iterSub, 'text');

      // ---- state for seek ----
      var _st = {
        cx:cx, cy:cy, ringR:ringR, n:n, stepAngle:stepAngle, period:period,
        comet:comet, glow:glow, iterLabel:iterLabel,
        stepNodes:stepNodes, arcPaths:arcPaths, arrowHeads:arrowHeads,
        innerCircle:innerCircle, nodeR:nodeR, u:u, dark:dark, innerItems:innerItems, innerStep:(e.innerLoopStep==null?1:e.innerLoopStep),
        accentIdx: 0
      };
      return _st;
    },

    seek: function(t, ctx, st){
      var s = st || (ctx && ctx.state);
      if(!s) return;
      var cx = s.cx, cy = s.cy, ringR = s.ringR, n = s.n;
      var stepAngle = s.stepAngle, period = s.period;

      // single truth: comet angle (full circle per period)
      var uT = (t / period); // normalized 0..1 per lap
      var lap = Math.floor(uT);
      var phase = uT - lap; // 0..1 within current lap
      var angle = -Math.PI/2 + phase * 2 * Math.PI;

      // comet position
      var cxp = cx + Math.cos(angle)*ringR;
      var cyp = cy + Math.sin(angle)*ringR;
      s.comet.setAttribute('cx', cxp);
      s.comet.setAttribute('cy', cyp);
      s.glow.setAttribute('cx', cxp);
      s.glow.setAttribute('cy', cyp);

      // iteration counter (pad to keep width stable)
      var iterNum = lap + 1;
      var iterStr = '#' + iterNum;
      if(s.iterLabel.textContent !== iterStr){
        s.iterLabel.textContent = iterStr;
      }

      // current step = floor(phase * n)
      var curStep = Math.floor(phase * n);
      if(curStep >= n) curStep = n-1;

      // highlight current step (slow tempo: the step changes every period/n seconds)
      var stepPhase = (phase * n) - curStep; // 0..1 within current step

      for(var i=0;i<n;i++){
        var node = s.stepNodes[i];
        var ap = s.arcPaths[i];
        var ah = s.arrowHeads[i];
        var isCur = (i === curStep);
        var isNext = (i === (curStep+1)%n);
        // arc leading to curStep: accented
        if(isCur){
          // arc i runs from step i to step i+1: the one the comet is travelling along
          ap.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          ap.setAttribute('stroke-width', s.dark ? 2.5 : 3);
          ap.setAttribute('opacity', '1');
          ah.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
        } else if(isNext && stepPhase > 0.7){
          // approaching next step
          var k = (stepPhase - 0.7)/0.3;
          ap.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          ap.setAttribute('stroke-width', s.dark ? 1.5 + k : 2 + k);
          ap.setAttribute('opacity', String(0.4 + 0.6*k));
          ah.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
        } else {
          ap.setAttribute('stroke', ctx.cc('line2'));
          ap.setAttribute('stroke-width', s.dark ? 1.5 : 2);
          ap.setAttribute('opacity', s.dark ? '0.5' : '0.7');
          ah.setAttribute('fill', ctx.cc('line2'));
        }

        // node highlight
        if(isCur){
          node.circle.setAttribute('fill', ctx.cc(ctx.accf(s.accentIdx)));
          node.circle.setAttribute('stroke', ctx.cc(ctx.acc(s.accentIdx)));
          node.circle.setAttribute('stroke-width', '2.5');
          node.circle.setAttribute('r', String(s.nodeR * 1.25));
          node.num.setAttribute('fill', ctx.cc(ctx.acc(s.accentIdx)));
          node.num.setAttribute('font-weight', '700');
        } else {
          node.circle.setAttribute('fill', ctx.cc('panel'));
          node.circle.setAttribute('stroke', ctx.cc('line'));
          node.circle.setAttribute('stroke-width', '1.5');
          node.circle.setAttribute('r', String(s.nodeR));
          node.num.setAttribute('fill', ctx.cc('muted'));
